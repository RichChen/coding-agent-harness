[project]
name = "coding-harness"
version = "0.1.0"
description = "Controllable Coding Agent Runtime with integrated Eval Harness"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jsonschema>=4.23,<5",
    "numpy==2.5.3",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
retrieval = [
    # CUDA build: pip install "torch==2.14.1+cu126" --index-url https://download.pytorch.org/whl/cu126
    "torch==2.14.1+cu126",
    # transformers 4.x: the remote code of jina-embeddings-v2-base-code and CodeRankEmbed does not run on 5.x
    "sentence-transformers==5.7.0",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "huggingface-hub==0.36.2",
    "einops==0.8.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures/repos"]
markers = [
    "asyncio: marks async tests that require pytest-asyncio",
]
